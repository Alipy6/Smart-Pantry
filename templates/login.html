{% extends "layout.html" %}

{% block title %}Log In{% endblock %}

{% block main %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-4"><i class="bi bi-box-arrow-in-right text-success"></i> Log In</h2>
                <form action="/login" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Enter username" required type="text">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input class="form-control" id="password" name="password" placeholder="Enter password" required type="password">
                    </div>
                    <button class="btn btn-success w-100" type="submit">Log In</button>
                </form>
                <p class="text-center mt-3 mb-0">Don't have an account? <a href="/register">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
